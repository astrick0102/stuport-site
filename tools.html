<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tools | Coming Soon</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #020617;
            --text-primary: #e5e7eb;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #020617, var(--bg-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .container {
            background: linear-gradient(145deg, #020617, #020617);
            border: 1px solid #1e293b;
            padding: 3rem 3.5rem;
            border-radius: 14px;
            text-align: center;
            max-width: 520px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: var(--accent);
        }

        p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.2rem;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="status">IN DEVELOPMENT</span>

        <h1><span>Tools</span> Page</h1>

        <p>
            Powerful utilities are being engineered behind the scenes.
            This section will soon host tools designed for speed,
            precision, and real-world problem solving.
        </p>

        <footer>
                 <p class="text-muted">
                    © 2026 StuPort. All rights reserved.
        </footer>
    </div>

</body>
</html>
